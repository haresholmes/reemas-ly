<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold25" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="35%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
  </defs>
  <!-- Mark: The Haute Joaillerie Diadem & Floating Solitaire -->
  <g transform="translate(200, 150)">
    <!-- Main Diadem Arch Line -->
    <path d="M-72,25 C-56,25 -42,-15 -28,-15 C-18,-15 -12,-65 0,-65 C12,-65 18,-15 28,-15 C42,-15 56,25 72,25" fill="none" stroke="url(#gold25)" stroke-width="4" stroke-linecap="round"/>
    <!-- Lower Base Foundation Arch -->
    <path d="M-64,38 C-32,46 32,46 64,38" fill="none" stroke="url(#gold25)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Connecting Vertical Struts -->
    <line x1="-48" y1="18" x2="-48" y2="38" stroke="url(#gold25)" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="44" stroke="url(#gold25)" stroke-width="2"/>
    <line x1="48" y1="18" x2="48" y2="38" stroke="url(#gold25)" stroke-width="2"/>
    <!-- Floating Solitaire Gem Above Central Peak -->
    <polygon points="0,-82 12,-70 0,-58 -12,-70" fill="#FFFDF0"/>
    <polygon points="0,-82 0,-58 -12,-70" fill="#E5C058" opacity="0.7"/>
    <!-- Side Accent Diamond Dots -->
    <circle cx="-28" cy="-24" r="3.5" fill="url(#gold25)"/>
    <circle cx="28" cy="-24" r="3.5" fill="url(#gold25)"/>
  </g>
  <!-- Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold25)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold25)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>
