<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Golden Crescent Arch -->
    <path d="M-38,-45 C25,-55 58,5 34,54 C15,85 -35,75 -48,42 C-20,58 18,48 24,18 C28,-8 5,-35 -38,-45 Z" fill="url(#gold)"/>
    <!-- Floating Solitaire Diamond in Negative Space Center -->
    <g transform="translate(-8, 5)">
      <polygon points="0,-26 18,-10 0,22 -18,-10" fill="none" stroke="#FFF1BF" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="0,-10 10,0 0,10 -10,0" fill="url(#gold)"/>
    </g>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">PRECIOUS METALS</text>
</svg>