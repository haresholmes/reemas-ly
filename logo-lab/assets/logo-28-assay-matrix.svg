<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold28" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="35%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
  </defs>
  <!-- Mark: 4 Precision Gold Bullion Bars + Negative Space Radiant Star -->
  <g transform="translate(200, 145)">
    <!-- Bar 1 (Top Vertical Offset) -->
    <rect x="-10" y="-72" width="20" height="52" fill="url(#gold28)" rx="2"/>
    <!-- Bar 2 (Right Horizontal Offset) -->
    <rect x="20" y="-10" width="52" height="20" fill="url(#gold28)" rx="2"/>
    <!-- Bar 3 (Bottom Vertical Offset) -->
    <rect x="-10" y="20" width="20" height="52" fill="url(#gold28)" rx="2"/>
    <!-- Bar 4 (Left Horizontal Offset) -->
    <rect x="-72" y="-10" width="52" height="20" fill="url(#gold28)" rx="2"/>
    <!-- Central Negative Space 4-Point Star Diamond -->
    <polygon points="0,-16 5,-5 16,0 5,5 0,16 -5,5 -16,0 -5,-5" fill="#FFFDF0"/>
    <!-- Outer Micro Accent Dots -->
    <circle cx="0" cy="-80" r="2.5" fill="url(#gold28)"/>
    <circle cx="80" cy="0" r="2.5" fill="url(#gold28)"/>
    <circle cx="0" cy="80" r="2.5" fill="url(#gold28)"/>
    <circle cx="-80" cy="0" r="2.5" fill="url(#gold28)"/>
  </g>
  <!-- Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold28)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold28)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>
