<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gold21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="35%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldDark21" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#78550B"/>
    </linearGradient>
  </defs>
  <!-- Mark: Dual Sharp Chevrons + Solitaire Diamond Kite -->
  <g transform="translate(200, 145)">
    <!-- Solitaire Diamond Kite at Top -->
    <polygon points="0,-72 20,-48 0,-24 -20,-48" fill="#FFFDF0"/>
    <polygon points="0,-72 0,-24 -20,-48" fill="#F3E5AB" opacity="0.8"/>
    <!-- Upper Chevron Wing (Left) -->
    <polygon points="-58,-2 0,-34 0,-18 -44,8" fill="url(#gold21)"/>
    <!-- Upper Chevron Wing (Right) -->
    <polygon points="58,-2 0,-34 0,-18 44,8" fill="url(#goldDark21)"/>
    <!-- Lower Chevron Wing (Left) -->
    <polygon points="-68,28 0,-8 0,8 -54,40" fill="url(#gold21)"/>
    <!-- Lower Chevron Wing (Right) -->
    <polygon points="68,28 0,-8 0,8 54,40" fill="url(#goldDark21)"/>
    <!-- Central Ingot Base Accent -->
    <polygon points="0,20 16,30 0,40 -16,30" fill="url(#gold21)"/>
  </g>
  <!-- Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold21)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold21)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>
