<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <!-- Mark Only: Pure, sharp, iconic geometry -->
  <g transform="translate(200, 150)">
    <!-- Top Ingot/Facet Peak -->
    <polygon points="0,-60 36,-38 0,-16 -36,-38" fill="url(#gold)"/>
    <!-- Left Angled Face of 'ر' -->
    <polygon points="-36,-38 0,-16 0,45 -36,23" fill="#A17720"/>
    <!-- Right Golden Sweep forming Arabic 'ر' -->
    <path d="M0,-16 L36,-38 L36,15 C36,48 18,72 -24,80 L-32,68 C2,62 16,46 16,20 L16,-6 Z" fill="url(#gold)"/>
    <!-- Floating Center Spark Point -->
    <polygon points="0,-36 3,-30 0,-24 -3,-30" fill="#FFF9D6"/>
  </g>
  <!-- Minimalist Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>