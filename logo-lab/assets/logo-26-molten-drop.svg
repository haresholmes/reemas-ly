<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldDrop26" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC"/>
      <stop offset="40%" stop-color="#E5C058"/>
      <stop offset="100%" stop-color="#8F6510"/>
    </linearGradient>
    <linearGradient id="facetGold26" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECCF78"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
  </defs>
  <!-- Mark: Pear-Cut Diamond & Liquid Molten Gold Droplet -->
  <g transform="translate(200, 145)">
    <!-- Left Half: Smooth Molten Gold Arc -->
    <path d="M0,-72 C-38,-20 -52,18 -52,42 C-52,68 -28,82 0,82 L0,-72 Z" fill="url(#goldDrop26)"/>
    <!-- Right Half: Faceted Geometric Diamond Planes -->
    <!-- Facet 1: Upper Triangle -->
    <polygon points="0,-72 38,10 0,22" fill="#FFEAA7"/>
    <!-- Facet 2: Outer Flank -->
    <polygon points="38,10 52,42 22,65 0,22" fill="url(#facetGold26)"/>
    <!-- Facet 3: Bottom Base -->
    <polygon points="0,22 22,65 0,82" fill="#996F12"/>
    <!-- Highlight Sparkle at Apex -->
    <circle cx="0" cy="-72" r="2.5" fill="#FFFFFF"/>
    <!-- Internal Negative Space Slit -->
    <line x1="0" y1="-65" x2="0" y2="76" stroke="#03070E" stroke-width="2"/>
  </g>
  <!-- Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#goldDrop26)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#goldDrop26)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>
