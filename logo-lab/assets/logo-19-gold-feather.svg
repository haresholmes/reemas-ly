<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- Central Spine of Feather -->
    <path d="M-20,50 Q10,0 25,-60" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Geometric Vanes -->
    <path d="M-20,30 Q-5,15 5,-10" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M-10,0 Q5,-10 15,-30" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Geometric Vanes -->
    <path d="M-2,35 Q15,20 28,0" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <path d="M12,5 Q25,-10 32,-30" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
    <!-- Crown Diamond Point -->
    <polygon points="25,-60 30,-52 25,-44 20,-52" fill="#FFF9D6"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">FINE MILLIGRAM PURITY</text>
</svg>