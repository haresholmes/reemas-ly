<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 145)">
    <!-- Octagonal Emerald Cut Outer Border -->
    <polygon points="-32,-60 32,-60 55,-35 55,35 32,60 -32,60 -55,35 -55,-35" 
             fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Inner Concentric Hairline -->
    <polygon points="-24,-48 24,-48 42,-28 42,28 24,48 -24,48 -42,28 -42,-28" 
             fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.5" stroke-linejoin="round"/>
    <!-- Center Monogram 'ر' Inside Diamond -->
    <path d="M-8,-25 C14,-20 22,-5 20,15 C18,32 0,42 -22,42" 
          fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="0,-30 4,-24 0,-18 -4,-24" fill="#FFF9D6"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">EMERALD CUT LUXURY</text>
</svg>