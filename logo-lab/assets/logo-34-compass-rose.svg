<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldLight34" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5CC"/>
      <stop offset="100%" stop-color="#E5C058"/>
    </linearGradient>
    <linearGradient id="goldDark34" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C59B27"/>
      <stop offset="100%" stop-color="#78550B"/>
    </linearGradient>
  </defs>
  <!-- Mark: Mediterranean Gold Import Trade Compass Rose & Diamond Prisms -->
  <g transform="translate(200, 145)">
    <!-- North Spear -->
    <polygon points="0,-78 12,-12 0,0" fill="url(#goldLight34)"/>
    <polygon points="0,-78 -12,-12 0,0" fill="url(#goldDark34)"/>
    <!-- South Spear -->
    <polygon points="0,78 -12,12 0,0" fill="url(#goldLight34)"/>
    <polygon points="0,78 12,12 0,0" fill="url(#goldDark34)"/>
    <!-- East Spear -->
    <polygon points="78,0 12,12 0,0" fill="url(#goldLight34)"/>
    <polygon points="78,0 12,-12 0,0" fill="url(#goldDark34)"/>
    <!-- West Spear -->
    <polygon points="-78,0 -12,-12 0,0" fill="url(#goldLight34)"/>
    <polygon points="-78,0 -12,12 0,0" fill="url(#goldDark34)"/>
    <!-- 4 Diagonal Micro Rays -->
    <polygon points="32,-32 8,-4 4,-8" fill="#FFFDF0"/>
    <polygon points="-32,-32 -8,-4 -4,-8" fill="url(#goldDark34)"/>
    <polygon points="32,32 8,4 4,8" fill="url(#goldDark34)"/>
    <polygon points="-32,32 -8,4 -4,8" fill="#FFFDF0"/>
    <!-- Center Radiant Diamond Nucleus -->
    <circle cx="0" cy="0" r="5" fill="#FFFDF0"/>
  </g>
  <!-- Typography -->
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#goldLight34)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#goldLight34)" letter-spacing="4">GOLD &amp; JEWELRY</text>
</svg>
