<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  <style>@font-face{font-family:'IBM Plex Sans Arabic';font-weight:600;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Jost';font-weight:500;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'Jost';font-weight:600;src:url(data:font/woff;base64,) format('woff');}</style></defs>
  <g transform="translate(200, 150)">
    <!-- Semi-circle Gold Horizon Disc -->
    <path d="M-50,15 A 50 50 0 0 1 50 15 Z" fill="url(#gold)"/>
    <!-- Base Horizon Line -->
    <line x1="-65" y1="22" x2="65" y2="22" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Rising Sun Rays -->
    <line x1="0" y1="-42" x2="0" y2="-60" stroke="#FFF0B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="-32" y1="-28" x2="-45" y2="-42" stroke="#FFF0B8" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="-28" x2="45" y2="-42" stroke="#FFF0B8" stroke-width="2" stroke-linecap="round"/>
    <!-- Center Apex Diamond -->
    <polygon points="0,-10 12,5 0,20 -12,5" fill="#03070E" stroke="#FFF9D6" stroke-width="2"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">DAWN OF GOLD</text>
</svg>