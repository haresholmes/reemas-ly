<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0B8"/>
      <stop offset="30%" stop-color="#E5C058"/>
      <stop offset="70%" stop-color="#B58525"/>
      <stop offset="100%" stop-color="#ECCF78"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE08A"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>
  <g transform="translate(200, 150)">
    <!-- 3-Point Royal Crown Geometry -->
    <polygon points="-48,25 -32,-35 -12,5 0,-50 12,5 32,-35 48,25 0,35" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Crown Base Band -->
    <line x1="-48" y1="25" x2="48" y2="25" stroke="url(#gold)" stroke-width="3"/>
    <!-- 3 Diamond Points at the Crown Peaks -->
    <circle cx="-32" cy="-35" r="3.5" fill="#FFF9D6"/>
    <circle cx="0" cy="-50" r="4.5" fill="#FFF9D6"/>
    <circle cx="32" cy="-35" r="3.5" fill="#FFF9D6"/>
    <!-- Center Inset Rhombus -->
    <polygon points="0,0 8,12 0,24 -8,12" fill="url(#gold)"/>
  </g>
  <text x="200" y="278" text-anchor="middle" font-family="'IBM Plex Sans Arabic', sans-serif" font-size="32" font-weight="600" fill="url(#gold)" letter-spacing="1.5">الـريـمـاس</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Jost', sans-serif" font-size="13" font-weight="600" fill="#CBD5E1" letter-spacing="7.5">AL REEMAS</text>
  <text x="200" y="326" text-anchor="middle" font-family="'Jost', sans-serif" font-size="9" font-weight="500" fill="url(#gold)" letter-spacing="4">ROYAL JEWEL HOUSE</text>
</svg>