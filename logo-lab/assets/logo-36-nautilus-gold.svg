    <line x1="-50" y1="-30" x2="-10" y2="-5" stroke="url(#gold36)" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="-70" x2="0" y2="-20" stroke="url(#gold36)" stroke-width="2" opacity="0.6"/>
    <line x1="55" y1="-50" x2="15" y2="-15" stroke="url(#gold36)" stroke-width="2" opacity="0.6"/>
    <line x1="68" y1="0" x2="25" y2="0" stroke="url(#gold36)" stroke-width="2" opacity="0.6"/>
