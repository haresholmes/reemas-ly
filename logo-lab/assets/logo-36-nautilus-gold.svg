    <path d="M-68,30 C-68,-40 -15,-72 35,-65 C65,-60 75,-30 65,0 C55,25 30,35 10,25 C-5,18 -10,0 -2,-10 C5,-18 18,-15 18,-6" fill="none" stroke="url(#gold36)" stroke-width="4.5" stroke-linecap="round"/>
