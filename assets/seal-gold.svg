<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF1BF"/>
      <stop offset="25%" stop-color="#E6C15B"/>
      <stop offset="60%" stop-color="#B58525"/>
      <stop offset="85%" stop-color="#ECCF78"/>
      <stop offset="100%" stop-color="#8E6215"/>
    </linearGradient>
    <linearGradient id="sealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1B33"/>
      <stop offset="100%" stop-color="#050B14"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&amp;family=Jost:wght@500;600;700&amp;display=swap');
      .gold-txt { fill: url(#sealGold); }
      .navy-txt { fill: #081426; }
      .latin { font-family: 'Jost', 'Cinzel', -apple-system, sans-serif; }
      .arabic { font-family: 'IBM Plex Sans Arabic', 'Amiri', serif; }
    </style>
    <path id="topArc" d="M 86 300 A 214 214 0 0 1 514 300" fill="none"/>
    <path id="botArc" d="M 86 300 A 214 214 0 0 0 514 300" fill="none"/>
  </defs>

  <!-- Milled Coin Outer Edge & Multiple Security Rings -->
  <circle cx="300" cy="300" r="286" fill="none" stroke="url(#sealGold)" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="300" r="275" fill="none" stroke="url(#sealGold)" stroke-width="4"/>
  <circle cx="300" cy="300" r="265" fill="none" stroke="url(#sealGold)" stroke-width="2.5"/>
  <circle cx="300" cy="300" r="256" fill="none" stroke="url(#sealGold)" stroke-width="1" stroke-dasharray="2 4" opacity="0.85"/>
  <circle cx="300" cy="300" r="244" fill="none" stroke="url(#sealGold)" stroke-width="1.5"/>
  
  <!-- Inner Boundary Rings -->
  <circle cx="300" cy="300" r="172" fill="none" stroke="url(#sealGold)" stroke-width="2"/>
  <circle cx="300" cy="300" r="165" fill="none" stroke="url(#sealGold)" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Top Arc: AL REEMAS CENTER -->
  <text class="latin gold-txt" font-size="20" font-weight="700" letter-spacing="6.5">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">
      AL REEMAS CENTER ★ GOLD IMPORT
    </textPath>
  </text>

  <!-- Bottom Arc: LEGAL CREDENTIALS -->
  <text class="latin gold-txt" font-size="14" font-weight="600" letter-spacing="3.5">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">
      CR: 45069 · LIC: 5445069 · TAX: 21566 · 2013
    </textPath>
  </text>

  <!-- Side Sovereign Stars -->
  <g transform="translate(86, 300)">
    <polygon points="0,-8 2.5,-2.5 8,-2.5 3.5,1.5 5,7.5 0,4 -5,7.5 -3.5,1.5 -8,-2.5 -2.5,-2.5" fill="url(#sealGold)"/>
  </g>
  <g transform="translate(514, 300)">
    <polygon points="0,-8 2.5,-2.5 8,-2.5 3.5,1.5 5,7.5 0,4 -5,7.5 -3.5,1.5 -8,-2.5 -2.5,-2.5" fill="url(#sealGold)"/>
  </g>

  <!-- Center Core: 3D Diamond / Shield Royal Crest -->
  <g transform="translate(300, 230)">
    <circle cx="0" cy="-12" r="44" fill="none" stroke="url(#sealGold)" stroke-width="0.6" opacity="0.4" stroke-dasharray="2 4"/>
    <g fill="none" stroke="url(#sealGold)" stroke-width="2.5" stroke-linejoin="round">
      <polygon points="0,-65 38,-42 48,0 28,38 0,55 -28,38 -48,0 -38,-42" fill="none" stroke="url(#sealGold)" stroke-width="2.6"/>
      <polygon points="0,-45 25,-28 0,-8 -25,-28" fill="url(#sealGold)" fill-opacity="0.18" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="0" y1="-65" x2="0" y2="-45" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="38" y1="-42" x2="25" y2="-28" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="-38" y1="-42" x2="-25" y2="-28" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="48" y1="0" x2="25" y2="-28" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="-48" y1="0" x2="-25" y2="-28" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="0" y1="-8" x2="0" y2="55" stroke="url(#sealGold)" stroke-width="2"/>
      <line x1="25" y1="-28" x2="0" y2="55" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="-25" y1="-28" x2="0" y2="55" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="48" y1="0" x2="28" y2="38" stroke="url(#sealGold)" stroke-width="1.6"/>
      <line x1="-48" y1="0" x2="-28" y2="38" stroke="url(#sealGold)" stroke-width="1.6"/>
    </g>
  </g>

  <!-- Typography Inside Center Core -->
  <text x="300" y="338" text-anchor="middle" class="arabic gold-txt" font-size="34" font-weight="700" letter-spacing="0.5">مركز الريماس</text>
  <text x="300" y="365" text-anchor="middle" class="arabic gold-txt" font-size="14.5" font-weight="600">لاستيراد الذهب والمجوهرات</text>

  <!-- Filigree Divider -->
  <line x1="215" y1="382" x2="275" y2="382" stroke="url(#sealGold)" stroke-width="1.2"/>
  <polygon points="300,379 303,382 300,385 297,382" fill="url(#sealGold)"/>
  <line x1="325" y1="382" x2="385" y2="382" stroke="url(#sealGold)" stroke-width="1.2"/>

  <text x="300" y="404" text-anchor="middle" class="latin gold-txt" font-size="13.5" font-weight="700" letter-spacing="4">EST. 2013</text>
  <text x="300" y="426" text-anchor="middle" class="arabic gold-txt" font-size="13.5" font-weight="600">طرابلس - ليبيا</text>
  <text x="300" y="444" text-anchor="middle" class="latin gold-txt" font-size="11" font-weight="600" letter-spacing="3">TRIPOLI - LIBYA</text>
</svg>